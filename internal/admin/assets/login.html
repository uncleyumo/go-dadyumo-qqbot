<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 群友控制台</title>
<script>
/* 与 index.html 同一套规则：首帧前定主题，避免刷新时闪一下；
   没写过 localStorage 就跟随系统。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('admin-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
  :root {
    color-scheme:dark;
    --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e8ee; --dim:#8b93a7;
    --acc:#4f8cff; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#ffb454;
    --surface:#0d1016; --btn-fg:#fff;
  }
  html[data-theme="light"] {
    color-scheme:light;
    --bg:#f5f6f8; --card:#fff; --line:#d8dde5; --fg:#1b1f27; --dim:#5d6675;
    --acc:#2563eb; --ok:#15803d; --bad:#dc2626; --warn:#b45309;
    --surface:#f2f4f8; --btn-fg:#fff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
  .box { position:relative; width:340px; max-width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { margin:0 0 4px; font-size:18px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:22px; }
  label { display:block; font-size:12px; color:var(--dim); margin:14px 0 6px; }
  input { width:100%; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px; color:var(--fg); font-size:14px; outline:none; }
  input:focus { border-color:var(--acc); }
  button { width:100%; margin-top:20px; padding:11px; background:var(--acc); border:0; border-radius:8px; color:var(--btn-fg); font-size:14px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  /* 切换按钮覆盖上面的全宽主按钮样式 */
  .themebtn { position:absolute; top:12px; right:12px; width:30px; height:30px; margin:0; padding:0; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:1px solid var(--line); border-radius:7px; color:var(--dim); }
  .themebtn:hover { filter:none; color:var(--fg); }
  .themebtn svg { display:block; }
  html[data-theme="dark"] .themebtn .i-moon { display:none; }
  html[data-theme="light"] .themebtn .i-sun { display:none; }
  .err { color:var(--bad); font-size:13px; min-height:20px; margin-top:10px; }
  @media (max-width:768px) {
    /* iOS Safari 会对 <16px 的输入框自动放大整页；和 index.html 保持一致。 */
    input { font-size:16px; }
  }
  @media (max-width:480px) {
    body { padding:12px; }
    .box { padding:22px 18px; }
  }
</style>
</head>
<body>
  <div class="box">
    <button type="button" class="themebtn" id="theme-toggle" title="切换明暗主题" aria-label="切换明暗主题">
      <svg class="i-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <h1>群友控制台</h1>
    <div class="sub">QQ 群聊智能体 · 管理端</div>
    <form id="f">
      <label>用户名</label>
      <input id="u" autocomplete="username" value="admin">
      <label>密码</label>
      <input id="p" type="password" autocomplete="current-password" autofocus>
      <button type="submit">登录</button>
      <div class="err" id="e"></div>
    </form>
  </div>
<script>
const prefix = location.pathname.replace(/\/login\.html.*$/, '');
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const e = document.getElementById('e');
  e.textContent = '';
  const r = await fetch(prefix + '/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({user: document.getElementById('u').value, pass: document.getElementById('p').value})
  });
  const j = await r.json();
  if (j.ok) { location.href = prefix + '/'; } else { e.textContent = j.msg || '登录失败'; }
};

(function () {
  const btn = document.getElementById('theme-toggle');
  const root = document.documentElement;
  function sync() {
    const light = root.dataset.theme === 'light';
    const text = light ? '切换到深色' : '切换到浅色';
    btn.title = text;
    btn.setAttribute('aria-label', text);
  }
  sync();
  btn.onclick = () => {
    const next = root.dataset.theme === 'light' ? 'dark' : 'light';
    root.dataset.theme = next;
    try { localStorage.setItem('admin-theme', next); } catch (e) {}
    sync();
  };
})();
</script>
</body>
</html>
