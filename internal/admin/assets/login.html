<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 群友控制台</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e8ee; --dim:#8b93a7; --acc:#4f8cff; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#ffb454; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .box { width:340px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { margin:0 0 4px; font-size:18px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:22px; }
  label { display:block; font-size:12px; color:var(--dim); margin:14px 0 6px; }
  input { width:100%; padding:10px 12px; background:#0d1016; border:1px solid var(--line); border-radius:8px; color:var(--fg); font-size:14px; outline:none; }
  input:focus { border-color:var(--acc); }
  button { width:100%; margin-top:20px; padding:11px; background:var(--acc); border:0; border-radius:8px; color:#fff; font-size:14px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  .err { color:var(--bad); font-size:13px; min-height:20px; margin-top:10px; }
</style>
</head>
<body>
  <div class="box">
    <h1>群友控制台</h1>
    <div class="sub">QQ 群聊智能体 · 管理端</div>
    <form id="f">
      <label>用户名</label>
      <input id="u" autocomplete="username" value="admin">
      <label>密码</label>
      <input id="p" type="password" autocomplete="current-password" autofocus>
      <button type="submit">登录</button>
      <div class="err" id="e"></div>
    </form>
  </div>
<script>
const prefix = location.pathname.replace(/\/login\.html.*$/, '');
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const e = document.getElementById('e');
  e.textContent = '';
  const r = await fetch(prefix + '/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({user: document.getElementById('u').value, pass: document.getElementById('p').value})
  });
  const j = await r.json();
  if (j.ok) { location.href = prefix + '/'; } else { e.textContent = j.msg || '登录失败'; }
};
</script>
</body>
</html>
